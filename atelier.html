<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier — associations Atlas</title><style>body{font:16px system-ui;background:#f5f3ee;color:#222;margin:16px}main{max-width:900px;margin:auto}input,select,button,textarea{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}article{background:white;padding:16px;border-radius:12px;margin:12px 0}img{width:100%;max-height:280px;object-fit:contain}label{display:block;margin:8px 0}textarea{width:100%}button{margin:4px}small{display:block}</style><main><a href="index.html">Retour à l’Atlas</a><h1>Atelier des associations</h1><p>Édition locale : aucune publication automatique. Exporter le registre pour intégration dans GitHub. Ne pas saisir de secret.</p><input id="q" placeholder="Sujet ou numéro"><select id="filter"><option value="">Tous les statuts</option><option value="a_verifier">À vérifier</option><option value="a_completer">À compléter</option><option value="associee">Associée</option><option value="testee">Testée</option><option value="validee">Validée</option></select><select id="visual"><option value="">Tous les cadrages</option><option value="issues">À contrôler ou corriger</option><option value="ok">Sans défaut majeur apparent</option></select><button id="export">Exporter JSON</button><p id="count"></p><section id="list"></section><button id="more">Afficher davantage</button></main><script>
(async()=>{const $=id=>document.getElementById(id);let data,recipeIndex=[];try{const response=await fetch('data/illustration-registry.json');if(!response.ok)throw Error(response.status);data=await response.json();const ri=await fetch('data/recipe-index.json');if(!ri.ok)throw Error('Index recettes indisponible');recipeIndex=(await ri.json()).records;const di=await fetch('data/dynamic-recipe-index.json');if(!di.ok)throw Error('Index dynamique indisponible');recipeIndex.push(...(await di.json()).records);recipeIndex.sort((a,b)=>a.title.localeCompare(b.title,'fr'));const draft=localStorage.getItem('atlas-v10-registry-draft');if(draft){const parsed=JSON.parse(draft);if(parsed.schema===data.schema&&parsed.records.length===data.records.length)data=parsed;}}catch(e){$('count').textContent='Chargement impossible : '+e.message;return;}let limit=20;const save=()=>{try{localStorage.setItem('atlas-v10-registry-draft',JSON.stringify(data));}catch(e){$('count').textContent='Stockage local indisponible : exporter avant de quitter.';}};const statuses={a_verifier:'À vérifier',a_completer:'À compléter',associee:'Associée',testee:'Testée',validee:'Validée'};function render(){const q=$('q').value.toLowerCase();const rows=data.records.filter(r=>(r.id+' '+r.subject).toLowerCase().includes(q)&&(!$('filter').value||r.status===$('filter').value)&&(!$('visual').value||($('visual').value==='ok')===(r.visualInspection?.status==='pas_de_defaut_majeur_sur_planche')));$('count').textContent=rows.length+' illustrations';$('list').replaceChildren();for(const r of rows.slice(0,limit)){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=r.assetPrefix+' — '+r.subject;a.append(h);const visual=document.createElement('small');visual.textContent='Audit visuel : '+(r.visualInspection?.status||'non renseigné').replaceAll('_',' ')+' — contrôle pleine résolution non effectué';a.append(visual);for(const src of r.assets){const im=document.createElement('img');im.src=src;im.alt=r.subject;im.loading='lazy';a.append(im);}const c=document.createElement('small');c.textContent='Candidats historiques : '+(r.legacyCandidates.map(x=>x.anchor||x.query).join(' ; ')||'aucun');a.append(c);const l=document.createElement('label');l.textContent='Identifiants de recettes (un par ligne)';const input=document.createElement('textarea');input.value=r.recipeIds.join('\n');input.onchange=()=>{r.recipeIds=input.value.split('\n').map(x=>x.trim()).filter(Boolean);save();};l.append(input);a.append(l);const pick=document.createElement('select');pick.style.width='100%';pick.add(new Option('Ajouter une recette existante…',''));for(const recipe of recipeIndex)pick.add(new Option(recipe.title+(recipe.source?' — '+recipe.source:''),recipe.id));pick.onchange=()=>{if(pick.value&&!r.recipeIds.includes(pick.value)){r.recipeIds.push(pick.value);input.value=r.recipeIds.join('\n');save();}pick.value='';};a.append(pick);const warn=document.createElement('small');const check=()=>{const unknown=r.recipeIds.filter(id=>!recipeIndex.some(x=>x.id===id));warn.textContent=unknown.length?'Identifiants non reconnus dans cet index : '+unknown.join(', '):'';};input.addEventListener('change',check);check();a.append(warn);const st=document.createElement('select');for(const [k,v] of Object.entries(statuses))st.add(new Option(v,k));st.value=r.status;st.onchange=()=>{r.status=st.value;save();};a.append(st);$('list').append(a);}$('more').hidden=rows.length<=limit;} $('q').oninput=$('filter').onchange=$('visual').onchange=()=>{limit=20;render();};$('more').onclick=()=>{limit+=20;render();};$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='illustration-registry.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();})();
</script></html>
